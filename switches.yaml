switch:
  - platform: restart
    name: "Restart device"
  
  ###### RELAYS #########
  - platform: gpio
    name: "Relay_1"
    pin: 13
    id: relay_1
    internal: $hide_outputs
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    name: "Relay_2"
    pin: 12
    id: relay_2
    internal: $hide_outputs
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    name: "Relay_3"
    pin: 4
    id: relay_3
