    internal: $hide_outputs
    restore_mode: RESTORE_DEFAULT_OFF

  ###### Virtual switches ########
  - platform: template
    name: "light_1"
    id: light_1
    lambda: return id(input_1).state;
    restore_mode: DISABLED
    turn_on_action:
      - script.execute:
          id: toggle_light_1
