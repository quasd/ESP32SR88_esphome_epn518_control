    restore_value: no
    initial_value: 'false'

script:
  - id: toggle_light_1
    mode: queued
    max_runs: 10
    parameters:
      light_wanted_state: bool
    then:
      - if:
          condition:
            lambda: 'return light_wanted_state != id(input_1).state;'
          then:
            - delay: 50ms  # Let any debounce/state propagation complete
            - if:
                condition:
                  lambda: 'return light_wanted_state != id(input_1).state;'  # Check again
                then:
                  - lambda: 'ESP_LOGI("toggle", "Starting toggle for light 1 to %s", light_wanted_state ? "ON" : "OFF");'
                  
                  - repeat:
                      count: 3
                      then:
                        - lambda: 'id(relay_1)->turn_on();'
                        - delay: $relay_pulse_duration
                        - lambda: 'id(relay_1)->turn_off();'
                        - delay: $state_check_delay
                        
                        - if:
                            condition:
                              lambda: 'return id(input_1).state == light_wanted_state;'
                            then:
                              - lambda: 'ESP_LOGI("toggle", "Light 1 successfully toggled");'
                              - script.stop: toggle_light_1
                            else:
                              - lambda: 'ESP_LOGW("toggle", "Light 1 retry needed");'
                else:
                  - lambda: 'ESP_LOGW("toggle", "Light 1 already in correct state after re-check, skipping");'
          else:
            - lambda: 'ESP_LOGW("toggle", "Light 1 already in correct state, skipping");'

