switch:
  - platform: restart
    name: "Restart device"
  
  ###### RELAYS #########
  - platform: gpio
    name: "Relay_1"
    pin: 13
    id: relay_1
    internal: $hide_outputs
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    name: "Relay_2"
    pin: 12
    id: relay_2
    internal: $hide_outputs
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    name: "Relay_3"
    pin: 4
    id: relay_3
    internal: $hide_outputs
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    name: "Relay_4"
    pin: 27
    id: relay_4
    internal: $hide_outputs
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    name: "Relay_5"
    id: relay_5
    internal: $hide_outputs
    restore_mode: RESTORE_DEFAULT_OFF
    pin: 26
  - platform: gpio
    name: "Relay_6"
    pin: 25
    internal: $hide_outputs
    restore_mode: RESTORE_DEFAULT_OFF
    id: relay_6
  - platform: gpio
    name: "Relay_7"
    pin: 33
    id: relay_7
    internal: $hide_outputs
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    name: "Relay_8"
    pin: 32
    id: relay_8
    internal: $hide_outputs
    restore_mode: RESTORE_DEFAULT_OFF

  ###### Virtual switches ########
  - platform: template
    name: "light_1"
    id: light_1
    lambda: |-
      if (id(light_1_toggling)) {
        return id(light_1_target_state);
      }
      return id(input_1).state;
    restore_mode: DISABLED
    turn_on_action:
      - lambda: |-
          ESP_LOGI("light", "Light 1 turn_on action called");
          id(light_1_toggling) = true;
          id(light_1_target_state) = true;
          id(light_1).publish_state(true);
      - script.execute:
          id: toggle_light_1
          light_wanted_state: true
      - script.wait: toggle_light_1
      - lambda: |-
          id(light_1_toggling) = false;
          id(light_1).publish_state(id(input_1).state);
    turn_off_action:
      - lambda: |-
          ESP_LOGI("light", "Light 1 turn_off action called");
          id(light_1_toggling) = true;
          id(light_1_target_state) = false;
          id(light_1).publish_state(false);
      - script.execute:
          id: toggle_light_1
          light_wanted_state: false
      - script.wait: toggle_light_1
      - lambda: |-
          id(light_1_toggling) = false;
          id(light_1).publish_state(id(input_1).state);

