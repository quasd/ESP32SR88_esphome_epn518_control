binary_sensor:
  - platform: gpio
    pin:
      number: 14
      mode:
        input: true
        pulldown: true
    id: input_1
    name: "Input_1"
    internal: $hide_inputs
    device_class: power
    filters:
      - delayed_on: $input_debounce_delay
