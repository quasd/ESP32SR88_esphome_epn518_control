substitutions:
  input_debounce_delay: "200ms"  # Debounce filter for binary sensor inputs
  relay_pulse_duration: "75ms"   # Pulse duration for latching relay
  state_check_delay: "500ms"     # Delay before checking if toggle succeeded

script:
  - id: toggle_light_1
    mode: queued
    max_runs: 10
    parameters:
      light_wanted_state: bool
    then:
      - lambda: |-
          if (light_wanted_state == id(light_1).state) {
            ESP_LOGW("toggle", "Light 1 already in correct state, skipping");
            return;
          }
          ESP_LOGI("toggle", "Starting toggle for light 1 to %s", light_wanted_state ? "ON" : "OFF");
      
      - repeat:
          count: 3
          then:
            - lambda: 'id(relay_1)->turn_on();'
            - delay: $relay_pulse_duration
            - lambda: 'id(relay_1)->turn_off();'
            - delay: $state_check_delay
            
            - if:
                condition:
                  lambda: 'return id(light_1).state == light_wanted_state;'
                then:
                  - lambda: 'ESP_LOGI("toggle", "Light 1 successfully toggled");'
                  - script.stop: toggle_light_1
                else:
                  - lambda: 'ESP_LOGW("toggle", "Light 1 retry needed");'

