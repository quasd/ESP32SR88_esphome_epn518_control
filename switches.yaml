substitutions:
  input_debounce_delay: "200ms"  # Debounce filter for binary sensor inputs
  relay_pulse_duration: "200ms"   # Pulse duration for latching relay
  state_check_delay: "600ms"     # Delay before checking if toggle succeeded
  on_off_delay: "300ms"

