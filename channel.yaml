globals:
  - id: light_${n}_toggling
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: light_${n}_target_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: light_${n}_retry_count
    type: int
    restore_value: no
    initial_value: '0'
  # Pulses sent in the toggle currently running.
  - id: light_${n}_attempts
    type: int
    restore_value: no
    initial_value: '0'
script:
  - id: toggle_light_${n}
    mode: queued
    max_runs: 10
    parameters:
      light_wanted_state: bool
    then:
      - if:
          condition:
            lambda: 'return light_wanted_state != id(input_${n}).state;'
          then:
            - delay: 50ms  # Let any debounce/state propagation complete
            - if:
                condition:
                  lambda: 'return light_wanted_state != id(input_${n}).state;'  # Check again
                then:
                  - lambda: |-
                      ESP_LOGI("toggle", "Starting toggle for light ${n} to %s", light_wanted_state ? "ON" : "OFF");
                      id(light_${n}_attempts) = 0;

                  # Pulse until the input reports the wanted state, at most 3 times.
                  # This used to be a 3x repeat left early with script.stop, but stopping
                  # a queued script also empties its queue, so a request queued behind this
                  # one (turn_off sent right after turn_on) was silently dropped.
                  - while:
                      condition:
                        lambda: 'return id(light_${n}_attempts) < 3 && id(input_${n}).state != light_wanted_state;'
                      then:
                        - while:
                            condition:
                              lambda: 'return ${use_relay_lock} && id(relay_lock);'
                            then:
                              - delay: 10ms
                        - lambda: 'if (${use_relay_lock}) { id(relay_lock) = true; }'
                        - lambda: 'id(relay_${n})->turn_on();'
                        - delay: $relay_pulse_duration
                        - lambda: 'id(relay_${n})->turn_off();'
                        - lambda: 'if (${use_relay_lock}) { id(relay_lock) = false; }'
                        - delay: $state_check_delay
                        - lambda: |-
                            id(light_${n}_attempts) += 1;
                            if (id(input_${n}).state != light_wanted_state) {
                              id(light_${n}_retry_count) += 1;
                              id(light_${n}_retry_count_sensor).publish_state(id(light_${n}_retry_count));
                              ESP_LOGW("toggle", "Light ${n} retry needed (total retries: %d)", id(light_${n}_retry_count));
                            }

                  - if:
                      condition:
                        lambda: 'return id(input_${n}).state == light_wanted_state;'
                      then:
                        - lambda: 'ESP_LOGI("toggle", "Light ${n} successfully toggled");'
                      else:
                        - lambda: 'ESP_LOGE("toggle", "Light ${n} did not reach %s after 3 pulses", light_wanted_state ? "ON" : "OFF");'
                else:
                  - lambda: 'ESP_LOGW("toggle", "Light ${n} already in correct state after re-check, skipping");'
          else:
            - lambda: 'ESP_LOGW("toggle", "Light ${n} already in correct state, skipping");'

switch:
  - platform: gpio
    name: "Relay_${n}"
    pin: ${relay_pin}
    id: relay_${n}
    internal: $hide_outputs
    restore_mode: ${relay_restore_mode}

  - platform: template
    name: "light_${n}"
    id: light_${n}
    lambda: |-
      if (id(light_${n}_toggling)) {
        return id(light_${n}_target_state);
      }
      return id(input_${n}).state;
    restore_mode: DISABLED
    turn_on_action:
      - lambda: |-
          ESP_LOGI("light", "Light ${n} turn_on action called");
          id(light_${n}_toggling) = true;
          id(light_${n}_target_state) = true;
          id(light_${n}).publish_state(true);
      - script.execute:
          id: toggle_light_${n}
          light_wanted_state: true
      - script.wait: toggle_light_${n}
      - lambda: |-
          id(light_${n}_toggling) = false;
          id(light_${n}).publish_state(id(input_${n}).state);
    turn_off_action:
      - lambda: |-
          ESP_LOGI("light", "Light ${n} turn_off action called");
          id(light_${n}_toggling) = true;
          id(light_${n}_target_state) = false;
          id(light_${n}).publish_state(false);
      - script.execute:
          id: toggle_light_${n}
          light_wanted_state: false
      - script.wait: toggle_light_${n}
      - lambda: |-
          id(light_${n}_toggling) = false;
          id(light_${n}).publish_state(id(input_${n}).state);

binary_sensor:
  - platform: gpio
    pin:
      number: ${input_pin}
      mode:
        input: true
        pulldown: true
    id: input_${n}
    name: "Input_${n}"
    internal: $hide_inputs
    device_class: power
    filters:
      - delayed_on_off: $on_off_delay

sensor:
  - platform: template
    name: "Light_${n}_Retry_Count"
    id: light_${n}_retry_count_sensor
    icon: mdi:counter
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    lambda: 'return id(light_${n}_retry_count);'
    update_interval: 60s
